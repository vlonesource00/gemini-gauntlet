<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060a0f" />
    <title>GEMINI GAUNTLET // 12-Lap Grand Prix & AI Combat Simulation</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Scenario Deck Floating Control Drawer -->
    <div id="scenario-deck" class="scenario-deck" aria-label="Scenario Control Deck">
      <!-- Scenario Deck is rendered dynamically by ScenarioDeck.js -->
    </div>

    <!-- Loading Screen Overlay -->
    <div id="loading-screen" aria-live="polite">
      <div class="loading-mark">GEMINI<span>//</span>GAUNTLET</div>
      <div class="loading-rule"></div>
      <p id="loading-status">INITIALIZING SIMULATION CORE</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
